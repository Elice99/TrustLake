name: CI

# Action versions (checkout/setup-python/setup-node @v6) are evidence-based
# from a web search at the time this was written, not confirmed against
# GitHub's API directly (rate-limited during authoring). If a version tag
# doesn't exist, this workflow will fail immediately and clearly on the
# affected step — bump the tag if that happens.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    name: API (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustlake
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trustlake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustlake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Real connection to the CI-only Postgres service above — not a
      # secret, this only ever exists inside the CI run and is torn
      # down after. "test" is a fine password here specifically because
      # of that.
      DATABASE_URL: postgresql+asyncpg://trustlake:test@localhost:5432/trustlake
      POSTGRES_USER: trustlake
      POSTGRES_PASSWORD: test
      POSTGRES_DB: trustlake
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: ruff check .

      - run: black --check .

      - run: mypy app tests

      - run: pytest -v

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # No test framework configured yet (Stage 0 decision — deferred
      # until there's real UI logic worth testing). A successful build
      # is the meaningful gate for now: it proves the whole app compiles.
      - run: npm run build
