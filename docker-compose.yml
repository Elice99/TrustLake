# TrustLake — local development environment.
#
# Requires a .env file at the repo root (copy .env.example and fill in
# real values).
#
# No top-level `version:` key — obsolete in current Docker Compose and
# ignored with a warning if present.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host-side 5434, not 5432 or 5433 — avoids colliding with (a) a
      # locally installed Postgres running as a Windows service on 5432,
      # and (b) another local project's Postgres container also mapped
      # to 5433. Container-to-container traffic (api -> postgres) is
      # unaffected: it uses the Docker network's internal 5432, only
      # the host-facing mapping changes. Only matters if you're
      # connecting from the host itself (e.g. running pytest directly
      # on Windows, or psql from a host terminal).
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    init: true  # Runs a lightweight init (tini) as PID 1 inside the
    # container, so orphaned/zombie child processes (e.g. from
    # uvicorn --reload's file-watcher subprocess) get properly reaped
    # instead of becoming unkillable — this is what Docker's own error
    # message recommends when a container can't be stopped normally.
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount source for hot reload. This does not wipe installed
      # Python packages — those live in site-packages inside the image,
      # not under /app.
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
    # As of Stage 2 Day 1, the API genuinely connects to Postgres via
    # the async SQLAlchemy engine (app/db/session.py) — this dependency
    # is now load-bearing, not inert.

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      # Anonymous volumes: prevent the host bind mount above from
      # shadowing node_modules/.next that were built inside the image.
      # Without these, the host's (likely empty or absent) node_modules
      # would overwrite the container's installed dependencies.
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
