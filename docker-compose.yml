# TrustLake — local development environment.
#
# Requires a .env file at the repo root (see .env.example — created in the
# next build step). This file will not run correctly until that exists.
#
# No top-level `version:` key — obsolete in current Docker Compose and
# ignored with a warning if present.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount source for hot reload. This does not wipe installed
      # Python packages — those live in site-packages inside the image,
      # not under /app.
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
    # Note: the Stage 0 API stub does not connect to Postgres yet — this
    # dependency is set up ahead of Stage 2's real DB connection, per the
    # roadmap. It's inert right now, not exercised by any code.

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      # Anonymous volumes: prevent the host bind mount above from
      # shadowing node_modules/.next that were built inside the image.
      # Without these, the host's (likely empty or absent) node_modules
      # would overwrite the container's installed dependencies.
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
